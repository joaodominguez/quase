# Apache virtual host template for quase.pt.
#
# Intended server path:
#   /etc/apache2/sites-available/quase.pt.conf
#
# The main site is served from /var/www/quase.
# The existing /var/www/quase/mundial/ project remains available at /mundial/.

<VirtualHost *:80>
    ServerName quase.pt
    ServerAlias www.quase.pt

    Redirect permanent / https://quase.pt/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName quase.pt
    ServerAlias www.quase.pt

    DocumentRoot /var/www/quase
    DirectoryIndex index.html

    <Directory /var/www/quase>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Keep the existing subproject reachable and allow its current rules to work.
    <Directory /var/www/quase/mundial>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/quase.pt-error.log
    CustomLog ${APACHE_LOG_DIR}/quase.pt-access.log combined

    # Use the existing certificate if one is already installed for quase.pt,
    # or create one with certbot before enabling this vhost.
    # SSLCertificateFile /etc/letsencrypt/live/quase.pt/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/quase.pt/privkey.pem
    # Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
