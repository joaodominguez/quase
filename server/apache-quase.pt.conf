# Apache HTTP virtual host for quase.pt (static Next export).
#
# DocumentRoot: /var/www/quase
# Preserves /mundial → https://mundial.quase.pt

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName quase.pt
    ServerAlias www.quase.pt
    DocumentRoot /var/www/quase

    RedirectMatch 301 ^/mundial(/.*)?$ https://mundial.quase.pt$1

    <Directory /var/www/quase>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://quase.pt%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/quase_pt_error.log
    CustomLog ${APACHE_LOG_DIR}/quase_pt_access.log combined
</VirtualHost>
