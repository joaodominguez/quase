# Apache HTTP virtual host for quase.pt.
#
# Intended server path:
#   /etc/apache2/sites-available/quase.pt.conf
#
# The main site is served from /var/www/quase.
# The existing /var/www/quase/mundial/ project remains available at /mundial/.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName quase.pt
    ServerAlias www.quase.pt
    DocumentRoot /var/www/quase

    <Directory /var/www/quase>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/quase/mundial>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://quase.pt%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/quase_pt_error.log
    CustomLog ${APACHE_LOG_DIR}/quase_pt_access.log combined
</VirtualHost>
