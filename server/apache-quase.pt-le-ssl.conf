# Apache HTTPS virtual host for quase.pt.
#
# Intended server path:
#   /etc/apache2/sites-available/quase.pt-le-ssl.conf
#
# Requires a Let's Encrypt certificate at /etc/letsencrypt/live/quase.pt/.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    ServerName quase.pt
    ServerAlias www.quase.pt
    DocumentRoot /var/www/quase
    DirectoryIndex index.php index.html

    Alias /admin /var/www/quase-backoffice/public
    Alias /livewire /var/www/quase-backoffice/public
    Alias /css/filament /var/www/quase-backoffice/public/css/filament
    Alias /js/filament /var/www/quase-backoffice/public/js/filament
    Alias /fonts/filament /var/www/quase-backoffice/public/fonts/filament

    <Directory /var/www/quase>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/quase/mundial>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/quase-backoffice/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/quase_pt_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/quase_pt_ssl_access.log combined

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/quase.pt/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/quase.pt/privkey.pem
</VirtualHost>
</IfModule>
